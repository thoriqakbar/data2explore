[project]
name = "d2e-engine"
version = "0.1.0"
description = "data2explore deterministic engine scaffold"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1.5",
  "pandas>=2.2.3,<2.3",
  "pyreadstat>=1.2.8"
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
